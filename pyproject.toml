[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-telemetry-gateway"
version = "1.0.0"
description = "Offline full-stack telemetry gateway repair assignment"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.128.2",
  "uvicorn==0.48.0",
  # uvicorn ships no WebSocket protocol implementation of its own. Without one
  # it answers the /ws upgrade with 404, so the realtime channel is dead in the
  # running application even though the in-process tests pass. Local, free and
  # MIT licensed.
  "websockets==17.0.1"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2"
]

[project.scripts]
telemetry-gateway = "telemetry_gateway.__main__:main"
device-simulator = "simulator:main"

[tool.setuptools]
py-modules = ["simulator"]

[tool.setuptools.packages.find]
include = ["telemetry_gateway*"]

[tool.setuptools.package-data]
telemetry_gateway = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
